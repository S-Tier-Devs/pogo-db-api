name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Run every 6 hours at minute 15
    - cron: "15 0,6,12,18 * * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/last-hash.txt
          key: build-hash-${{ github.run_id }}
          restore-keys: |
            build-hash-

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Deploy to GitHub Pages
        if: contains(steps.build.outputs.CACHE_STATUS, 'HAS_CHANGES') || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
